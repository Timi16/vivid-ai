services:
  backend:
    build: ./vivid-backend
    ports:
      - "8000:8000"
    env_file:
      - ./vivid-backend/.env
    volumes:
      - ./vivid-backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./vivid-frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./vivid-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
