[package]
name = "vivid-code"
version = "0.1.0"
edition = "2021"
description = "Vivid Code — a coding agent in your terminal"

[[bin]]
name = "vivid"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
ignore = "0.4"
similar = "2"
owo-colors = "4"
dirs = "5"
toml = "0.8"
chrono = "0.4"
tokio-tungstenite = "0.24"
png = "0.17"
base64 = "0.22"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
regex = "1"
libc = "0.2"
rand = "0.8"
