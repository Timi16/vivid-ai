[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivid-ai"
dynamic = ["version"]
description = "Python SDK for Vivid AI — agentic browsing, chats, files and search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/vivid_ai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vivid_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Without the plugin installed, asyncio_mode is an unknown option and every
# async test skips with a warning while the suite still reports green — so the
# async half of the SDK would go unverified in CI without anything failing.
# Fail collection instead.
required_plugins = ["pytest-asyncio"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # __all__ is grouped by category with comments, which reads better than
    # one alphabetical block.
    "RUF022",
    # Self isn't in typing until 3.11 and this package supports 3.10; the
    # class name is the correct annotation here.
    "PYI034",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
