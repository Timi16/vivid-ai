# # Test -> build images -> deploy to the EC2 instance.
# #
# # A push to main that touches the backend (or the two services it cannot boot
# # without) runs the suite, builds images, pushes them to GHCR, and rolls them
# # out over SSH. The instance pulls images; it never builds, so a deploy is a
# # pull and a restart rather than a compile on a box that also serves traffic.
# #
# # Manual runs: workflow_dispatch with an image_tag redeploys an existing tag
# # without rebuilding, which is the rollback path (tags are commit SHAs).
